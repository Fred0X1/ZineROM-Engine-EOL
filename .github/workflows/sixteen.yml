name: QuantumROM Tools Sixteen.

on:
  workflow_dispatch:
    inputs:
      SAMFW_URL:
        description: "🔗 رابط تحميل فريم وير SamFW المباشر (سيبه فاضي لو هتعتمد على التحميل التلقائي)"
        required: false
        default: ""
      STOCK_DEVICE:
        description: "📱 جهازك الاقتصادي/الباجيت (اللي هيتفلش عليه البورت في الآخر) - مثال: SM-A155F"
        required: true
        default: "SM-A155F"
      TARGET_DEVICE:
        description: "👑 الجهاز الفلاج شيب (صاحب الروم الأصلية اللي هناخد منها الملفات) - مثال: SM-S928B"
        required: true
        default: "SM-S928B"
      TARGET_DEVICE_CSC:
        description: "🌍 منطقة الـ CSC للجهاز الفلاج شيب صاحب الروم الأصلية (مثال: BKD أو EGY)"
        required: true
        default: "BKD"
      KERNEL_VERSION:
        description: "🔧 إصدار كيرنال جهازك الاقتصادي الحالي (لتحديد رقعة الـ Hotspot للأجهزة القديمة)"
        required: true
        type: choice
        options:
          - "New Kernel (5.10 or higher)"
          - "Old Kernel (4.14 / 4.19 / 5.4)"
        default: "New Kernel (5.10 or higher)"
      OUTPUT_FILESYSTEM:
        description: "💾 نوع نظام الملفات الناتج (erofs للأجهزة الحديثة / ext4 للأجهزة القديمة)"
        required: true
        type: choice
        options:
          - erofs
          - ext4
          - f2fs
        default: erofs
      COMPRESS_IMG_TO_XZ:
        description: "⚡ ضغط الصور بصيغة XZ (عصر الملفات لتقليل المساحة زي رومات تيليجرام)"
        required: true
        type: choice
        options:
          - "True"
          - "False"
        default: "True"

jobs:
  build:
    name: Start QuantumROM Tools Sixteen.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository.
        uses: actions/checkout@v4

      - name: Validate STOCK_DEVICE
        run: |
          STOCK_DEVICE="${{ github.event.inputs.STOCK_DEVICE }}"
          DEVICE_PATH="QuantumROM/Devices/$STOCK_DEVICE"
          if [ "$STOCK_DEVICE" != "None" ] && [ ! -d "$DEVICE_PATH" ]; then
            echo "❌ $STOCK_DEVICE is not supported with this tool."
            exit 1
          fi

      - name: Remove unnecessary files.
        uses: rokibhasansagar/slimhub_actions@v25.42.5

      - name: Install Dependencies.
        run: |
          sudo apt install -y p7zip-full lz4 liblz4-1 liblz4-dev libzstd1 libzstd-dev build-essential android-sdk-libsparse-utils f2fs-tools fuse2fs fuse e2fsprogs python3 python3-pip zipalign unzip openjdk-17-jdk jq perl xxd kmod erofs-utils linux-modules-extra-$(uname -r)
          sudo modprobe f2fs
          pip3 install git+https://github.com/SN-Abdullah-Al-Noman/samloader.git --break-system-packages
          mkdir -p FW WORK OUT

      - name: Download firmware from SamFW
        run: |
          TARGET_DEV="${{ github.event.inputs.TARGET_DEVICE }}"
          SAMFW_LINK="${{ github.event.inputs.SAMFW_URL }}"
          
          mkdir -p "FW/$TARGET_DEV"
          
          if [ -n "$SAMFW_LINK" ]; then
            echo "🚀 جاري التحميل من رابط SamFW المباشر..."
            wget -U "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
                 -O "FW/$TARGET_DEV/samfw_firmware.zip" "$SAMFW_LINK"
          else
            echo "🔍 لم يتم إدخال رابط مباشر، سيتم الاعتماد على السكريبت الداخلي لبدء التحميل التلقائي..."
          fi
          
          echo "📦 جاري فك ضغط الأرشيف المستخرج..."
          cd "FW/$TARGET_DEV"
          unzip samfw_firmware.zip || true
          rm -f samfw_firmware.zip
          cd ../..

      - name: Extract firmware
        run: |
          source scripts/QuantumRom.sh
          EXTRACT_FIRMWARE "FW/${{ github.event.inputs.TARGET_DEVICE }}"

      - name: Start Rom Build For ${{ github.event.inputs.STOCK_DEVICE }}
        run: |
          if [ "${{ github.event.inputs.KERNEL_VERSION }}" = "Old Kernel (4.14 / 4.19 / 5.4)" ]; then
            USE_TETHER_FIX="True"
          else
            USE_TETHER_FIX="False"
          fi

          echo "🔧 حالة رقعة الكيرنال للأجهزة القديمة: $USE_TETHER_FIX"

          sudo bash sixteen.sh \
            "${{ github.event.inputs.STOCK_DEVICE }}" \
            "$USE_TETHER_FIX" \
            "${{ github.event.inputs.TARGET_DEVICE }}" \
            "${{ github.event.inputs.TARGET_DEVICE_CSC }}" \
            "353435774197736" \
            "${{ github.event.inputs.OUTPUT_FILESYSTEM }}"

      - name: Compress all .img & make zip file before upload.
        run: |
          echo "BUILD_TIME=$(TZ='Asia/Dhaka' date '+%Y-%m-%d %I:%M:%S %p UTC+6')" >> $GITHUB_ENV
          OUT_DIR="$(pwd)/OUT"
          ZIP_NAME="${{ github.event.inputs.TARGET_DEVICE }}_Port_For_${{ github.event.inputs.STOCK_DEVICE }}.zip"
          ZIP_PATH="$OUT_DIR/$ZIP_NAME"

          if [ "${{ github.event.inputs.COMPRESS_IMG_TO_XZ }}" = "True" ]; then
            echo "⚡ جاري عصر ملفات الـ .img بصيغة XZ (مستوى 9) لتقليل المساحة لأقصى حد..."
            for img in "$OUT_DIR"/*.img; do
              [ -f "$img" ] || continue
              echo "Compressing $img"
              sudo xz -9 -T0 "$img"
            done
            sudo rm -f "$OUT_DIR"/*.img
            
            echo "📦 جاري إنشاء ملف الـ Zip النهائي بالملفات المضغوطة..."
            7z a -tzip "$ZIP_PATH" "$OUT_DIR"/*.img.xz -mx=5
          else
            echo "📦 جاري تجميع ملفات الـ raw .img جوه الـ Zip مباشرة بدون ضغط إضافي..."
            7z a -tzip "$ZIP_PATH" "$OUT_DIR"/*.img -mx=5
          fi

          echo "ZIP_PATH=$ZIP_PATH" >> $GITHUB_ENV

      - name: Upload file in GoFile & Create Release.
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          STOCK_DEVICE: ${{ github.event.inputs.STOCK_DEVICE }}
          TARGET_DEVICE: ${{ github.event.inputs.TARGET_DEVICE }}
          OUTPUT_FILESYSTEM: ${{ github.event.inputs.OUTPUT_FILESYSTEM }}
          COMPRESS_IMG_TO_XZ: ${{ github.event.inputs.COMPRESS_IMG_TO_XZ }}
        run: |
          if [ "${{ github.event.inputs.KERNEL_VERSION }}" = "Old Kernel (4.14 / 4.19 / 5.4)" ]; then
            export USE_UI_8_TETHERING_APEX="True"
          else
            export USE_UI_8_TETHERING_APEX="False"
          fi
          bash release.sh
