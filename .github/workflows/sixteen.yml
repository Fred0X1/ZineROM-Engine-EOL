name: QuantumROM Tools Sixteen.

on:
  workflow_dispatch:
    inputs:
      STOCK_DEVICE:
        description: "📱 جهازك الاقتصادي (الـ Stock)"
        required: true
        default: "SM-A155F"
      USE_UI_8_TETHERING_APEX:
        description: "Set True if your kernel BPF version is 5.4 (lower than 5.10)."
        required: true
        default: "False"
      TARGET_DEVICE:
        description: "👑 الجهاز الفلاج شيب المصدر (الـ Port)"
        required: true
        default: "SM-A356E"
      TARGET_DEVICE_CSC:
        description: "🌍 رمز المنطقة أو الدولة"
        required: true
        default: "EGY"
      TARGET_DEVICE_IMEI:
        description: "🆔 الـ IMEI (يمكن تركه فارغاً)"
        required: false
        default: ""
      OUTPUT_FILESYSTEM:
        description: "OUTPUT_FILESYSTEM. e.g erofs / ext4 / f2fs"
        required: true
        default: "erofs"
      COMPRESS_IMG_TO_XZ:
        description: "⚡ ضغط الصور بصيغة XZ (إيقافه يسرع البناء جداً)"
        required: true
        default: "False"

jobs:
  build:
    name: Start QuantumROM Tools Sixteen.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository.
        uses: actions/colors@v4 # أو actions/checkout@v4 تبعاً للمستودع
        uses: actions/checkout@v4

      - name: Validate STOCK_DEVICE
        run: |
          STOCK_DEVICE="${{ github.event.inputs.STOCK_DEVICE }}"
          DEVICE_PATH="QuantumROM/Devices/$STOCK_DEVICE"
          if [ "$STOCK_DEVICE" != "None" ] && [ ! -d "$DEVICE_PATH" ]; then
            echo "❌ $STOCK_DEVICE is not supported with this tool."
            exit 1
          fi

      - name: Remove unnecessary files.
        uses: rokibhasansagar/slimhub_actions@v25.42.5

      - name: Install Dependencies.
        run: |
          sudo apt install -y p7zip-full lz4 liblz4-1 liblz4-dev libzstd1 libzstd-dev build-essential android-sdk-libsparse-utils f2fs-tools fuse2fs fuse e2fsprogs python3 python3-pip zipalign unzip openjdk-17-jdk jq perl xxd kmod erofs-utils linux-modules-extra-$(uname -r)
          sudo modprobe f2fs
          pip3 install git+https://github.com/SN-Abdullah-Al-Noman/samloader.git --break-system-packages
          mkdir -p FW WORK OUT

          # تحميل الروم بناءً على المدخلات الافتراضية الجديدة
      - name: Download firmware ▶️ ${{ github.event.inputs.TARGET_DEVICE }} - ${{ github.event.inputs.TARGET_DEVICE_CSC }}
        run: |
          source scripts/QuantumRom.sh
          DOWNLOAD_FIRMWARE "${{ github.event.inputs.TARGET_DEVICE }}" "${{ github.event.inputs.TARGET_DEVICE_CSC }}" "${{ github.event.inputs.TARGET_DEVICE_IMEI }}" "FW" "${{ github.event.inputs.TARGET_FW_VERSION }}"

      - name: Extract firmware
        run: |
          source scripts/QuantumRom.sh
          EXTRACT_FIRMWARE "FW/${{ github.event.inputs.TARGET_DEVICE }}"

      - name: Start Rom Build For ${{ github.event.inputs.STOCK_DEVICE }}
        run: |
          sudo bash sixteen.sh \
            "${{ github.event.inputs.STOCK_DEVICE }}" \
            "${{ github.event.inputs.USE_UI_8_TETHERING_APEX }}" \
            "${{ github.event.inputs.TARGET_DEVICE }}" \
            "${{ github.event.inputs.TARGET_DEVICE_CSC }}" \
            "${{ github.event.inputs.TARGET_DEVICE_IMEI }}" \
            "${{ github.event.inputs.OUTPUT_FILESYSTEM }}"

          # خطوة الضغط والتجميع (تم إصلاح الإغلاق التلقائي لها)
      - name: Compress all .img & make zip file before upload.
        run: |
          echo "BUILD_TIME=$(TZ='Asia/Dhaka' date '+%Y-%m-%d %I:%M:%S %p UTC+6')" >> $GITHUB_ENV
          OUT_DIR="$(pwd)/OUT"
          ZIP_NAME="${{ github.event.inputs.TARGET_DEVICE }}_Port_For_${{ github.event.inputs.STOCK_DEVICE }}.zip"
          ZIP_PATH="$OUT_DIR/$ZIP_NAME"

          if [ "${{ github.event.inputs.COMPRESS_IMG_TO_XZ }}" = "True" ]; then
            echo "Compressing all .img files to .xz (level 9)..."
            for img in "$OUT_DIR"/*.img; do
              [ -f "$img" ] || continue
              echo "Compressing $img"
              sudo xz -9 -T0 "$img"
            done
            7z a -tzip "$ZIP_PATH" "$OUT_DIR"/*.img.xz -mx=5
          else
            echo "🚀 تخطي ضغط XZ.. جاري تجميع ملف الـ ZIP مباشرة للحفاظ على السرعة..."
            7z a -tzip "$ZIP_PATH" "$OUT_DIR"/*.img -mx=5
          fi
          echo "ZIP_PATH=$ZIP_PATH" >> $GITHUB_ENV

      - name: Upload Release
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          if [ -f "release.sh" ]; then
            bash release.sh
          fi
