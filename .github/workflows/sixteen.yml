name: ZineROM Engine Sixteen.

on:
  workflow_dispatch:
    inputs:
      SAMFW_URL:
        description: "🔗 رابط تحميل فريم وير SamFW المباشر (سيبه فاضي لو هتعمل تحميل تلقائي)"
        required: false
        default: ""
      STOCK_DEVICE:
        description: "📱 جهازك الاقتصادي (الـ Stock)"
        required: true
        default: "SM-A155F"
      USE_UI_8_TETHERING_APEX:
        description: "🔧 خيار الكيرنال (True للأجهزة القديمة 5.4 / False للجديدة 5.10)"
        required: true
        type: choice
        options:
          - "False"
          - "True"
        default: "False"
      TARGET_DEVICE:
        description: "👑 الجهاز الفلاج شيب المصدر (الـ Port)"
        required: true
        default: "SM-A356E"
      TARGET_DEVICE_CSC:
        description: "🌍 رمز المنطقة أو الدولة"
        required: true
        default: "EGY"
      TARGET_DEVICE_IMEI:
        description: "🆔 الـ IMEI (مطلوب فقط لو خانة الرابط المباشر فوق فاضية)"
        required: false
        default: ""
      OUTPUT_FILESYSTEM:
        description: "💾 نوع نظام الملفات الناتج"
        required: true
        type: choice
        options:
          - erofs
          - ext4
          - f2fs
        default: erofs
      COMPRESS_IMG_TO_XZ:
        description: "⚡ ضغط الصور بصيغة XZ (اختر False لتسريع البناء زي التليجرام)"
        required: true
        type: choice
        options:
          - "False"
          - "True"
        default: "False"

jobs:
  build:
    name: Start ZineROM Engine Sixteen.
    runs-on: ubuntu-24.04

    steps:  
      - name: Checkout repository.  
        uses: actions/checkout@v4  

      - name: Validate STOCK_DEVICE  
        run: |  
          STOCK_DEVICE="${{ github.event.inputs.STOCK_DEVICE }}"  
          DEVICE_PATH="ZineROM/Devices/$STOCK_DEVICE"  
          if [ "$STOCK_DEVICE" != "None" ] && [ ! -d "$DEVICE_PATH" ]; then  
            echo "❌ $STOCK_DEVICE is not supported with this tool."  
            exit 1  
          fi  

      - name: Remove unnecessary files.  
        uses: rokibhasansagar/slimhub_actions@v25.42.5  

      - name: Install Dependencies.  
        run: |  
          sudo apt install -y p7zip-full lz4 liblz4-1 liblz4-dev libzstd1 libzstd-dev build-essential android-sdk-libsparse-utils f2fs-tools fuse2fs fuse e2fsprogs python3 python3-pip zipalign unzip openjdk-17-jdk jq perl xxd kmod erofs-utils linux-modules-extra-$(uname -r)  
          sudo modprobe f2fs  
          pip3 install git+https://github.com/SN-Abdullah-Al-Noman/samloader.git --break-system-packages  
          mkdir -p FW WORK OUT  

      - name: Download or Fetch Firmware  
        run: |  
          URL=$(echo "${{ github.event.inputs.SAMFW_URL }}" | tr -d '\r' | xargs)
          URL=$(echo "$URL" | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")
          
          TARGET_DEV=$(echo "${{ github.event.inputs.TARGET_DEVICE }}" | xargs)  
          TARGET_CSC=$(echo "${{ github.event.inputs.TARGET_DEVICE_CSC }}" | xargs)  
          IMEI_NUM=$(echo "${{ github.event.inputs.TARGET_DEVICE_IMEI }}" | xargs)  
            
          mkdir -p "FW/$TARGET_DEV"  
            
          if [ -n "$URL" ]; then  
            echo "🚀 [الطريقة الأولى]: تم اكتشاف رابط SamFW مباشر، جاري السحب السريع..."  
            curl -L -f -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" -o "FW/$TARGET_DEV/samfw_firmware.zip" "$URL" || { echo "❌ فشل تحميل الرابط المباشر!"; exit 1; }  
              
            echo "📦 جاري فك ضغط ملف الـ ZIP المباشر داخل مجلد الفيرموير..."  
            cd "FW/$TARGET_DEV"  
            unzip samfw_firmware.zip || true  
            rm -f samfw_firmware.zip  
            cd ../..  
          else  
            echo "🔍 [الطريقة الثانية]: الرابط فارغ، جاري السحب التلقائي عبر السكريبت الأساسي..."  
            source scripts/ZineRom.sh  
            DOWNLOAD_FIRMWARE "$TARGET_DEV" "$TARGET_CSC" "$IMEI_NUM" "FW" "${{ github.event.inputs.TARGET_FW_VERSION }}"  
          fi  

      - name: Extract firmware  
        run: |  
          source scripts/ZineRom.sh  
          EXTRACT_FIRMWARE "FW/${{ github.event.inputs.TARGET_DEVICE }}"  

      - name: Start Rom Build For ${{ github.event.inputs.STOCK_DEVICE }}  
        run: |  
          sudo bash sixteen.sh "${{ github.event.inputs.STOCK_DEVICE }}" "${{ github.event.inputs.TARGET_DEVICE }}" "${{ github.event.inputs.TARGET_DEVICE_CSC }}" "${{ github.event.inputs.OUTPUT_FILESYSTEM }}"

      - name: Upload Build Engine Logs  
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZineROM-Build-Logs
          path: zinrom_build.log
          retention-days: 7

      - name: Compress specific images & make zip file before upload  
        run: |  
          echo "BUILD_TIME=$(TZ='Asia/Dhaka' date '+%Y-%m-%d %I:%M:%S %p UTC+6')" >> $GITHUB_ENV  
          OUT_DIR="$(pwd)/OUT"  
          ZIP_NAME="${{ github.event.inputs.TARGET_DEVICE }}_Port_For_${{ github.event.inputs.STOCK_DEVICE }}.zip"  
          ZIP_PATH="$OUT_DIR/$ZIP_NAME"  

          echo "🔍 الفحص والتحقق من وجود الملفات المطلوبة داخل مجلد المخرجات..."  
          ls -la "$OUT_DIR"  

          if [ "${{ github.event.inputs.COMPRESS_IMG_TO_XZ }}" = "True" ]; then  
            echo "Compressing target files (system.img, product.img, system.ex*) to .xz (level 9)..."  
            for file in "$OUT_DIR"/system.img "$OUT_DIR"/product.img "$OUT_DIR"/system.ex*; do  
              if [ -f "$file" ]; then  
                echo "⚡ جاري ضغط الملف: $file"  
                sudo xz -9 -T0 "$file"  
                  else  
                echo "⚠️ الملف $file غير موجود في مجلد المخرجات، سيتم تخطيه."  
              fi  
            done  
            echo "📦 تجميع الملفات المضغوطة داخل ملف الـ ZIP النهائي..."  
            7z a -tzip "$ZIP_PATH" "$OUT_DIR"/system.img.xz "$OUT_DIR"/product.img.xz "$OUT_DIR"/system.ex*.xz -mx=5  
          else  
            echo "⚡ [وضع السرعة]: تجميع الملفات المحددة مباشرة بدون ضغط XZ..."  
            7z a -tzip "$ZIP_PATH" "$OUT_DIR"/system.img "$OUT_DIR"/product.img "$OUT_DIR"/system.ex* -mx=5  
          fi  
          echo "ZIP_PATH=$ZIP_PATH" >> $GITHUB_ENV  

      - name: Upload Release  
        env:  
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}  
        run: |  
          if [ -f "release.sh" ]; then  
            bash release.sh  
          fi

