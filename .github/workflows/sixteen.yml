name: ZineROM Engine Sixteen

on:
  workflow_dispatch:
    inputs:
      SAMFW_URL:
        description: "رابط تحميل فريم وير SamFW المباشر"
        required: true
        default: ""
      ONE_UI_VERSION:
        description: "إصدار One UI (مثال: 6.1 أو 7)"
        required: true
        default: "6.1"
      STOCK_DEVICE:
        description: "جهازك الاقتصادي (الـ Stock مثل SM-A528B)"
        required: true
        default: "SM-A528B"
      TARGET_DEVICE:
        description: "الجهاز الفلاج شيب المصدر (الـ Port)"
        required: true
        default: "SM-S711B"
      USE_UI_8_TETHERING_APEX:
        description: "خيار الكيرنال"
        required: true
        type: choice
        options:
          - "False"
          - "True"
        default: "False"
      OUTPUT_FILESYSTEM:
        description: "نوع نظام الملفات الناتج"
        required: true
        type: choice
        options:
          - erofs
          - ext4
          - f2fs
        default: erofs
      COMPRESS_IMG_TO_XZ:
        description: "ضغط الصور بصيغة XZ"
        required: true
        type: choice
        options:
          - "False"
          - "True"
        default: "False"

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Start ZineROM Engine Sixteen
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate STOCK_DEVICE
        run: |
          STOCK_DEVICE="${{ github.event.inputs.STOCK_DEVICE }}"
          DEVICE_PATH="ZineROM/Devices/$STOCK_DEVICE"
          if [ "$STOCK_DEVICE" != "None" ] && [ ! -d "$DEVICE_PATH" ]; then
            echo "❌ $STOCK_DEVICE is not supported with this tool."
            exit 1
          fi

      - name: Remove unnecessary files
        uses: rokibhasansagar/slimhub_actions@v25.42.5

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y p7zip-full lz4 liblz4-1 liblz4-dev libzstd1 libzstd-dev build-essential android-sdk-libsparse-utils f2fs-tools fuse2fs fuse e2fsprogs python3 python3-pip zipalign unzip openjdk-17-jdk jq perl xxd kmod erofs-utils linux-modules-extra-$(uname -r)
          sudo modprobe f2fs
          pip3 install git+https://github.com/SN-Abdullah-Al-Noman/samloader.git --break-system-packages
          mkdir -p FW WORK OUT

      - name: Download or Fetch Firmware
        run: |
          URL=$(echo "${{ github.event.inputs.SAMFW_URL }}" | tr -d '\r' | xargs)
          URL=$(echo "$URL" | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")
          TARGET_DEV=$(echo "${{ github.event.inputs.TARGET_DEVICE }}" | xargs)
          mkdir -p "FW/$TARGET_DEV"
          if [ -n "$URL" ]; then
            echo "🚀 جاري سحب الفيرموير عبر الرابط المباشر..."
            curl -sS --http1.1 -L -f --retry 5 --retry-delay 5 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" -o "FW/$TARGET_DEV/samfw_firmware.zip" "$URL" || { echo "❌ فشل تحميل الرابط المباشر!"; exit 1; }
            echo "📦 جاري فك ضغط الملف..."
            cd "FW/$TARGET_DEV"
            unzip samfw_firmware.zip || true
            rm -f samfw_firmware.zip
            cd ../..
          else
            echo "❌ يجب وضع رابط SamFW مباشر للتحميل!"
            exit 1
          fi

      - name: Extract firmware
        run: |
          if [ -f "scripts/ZineRom.sh" ]; then
            source scripts/ZineRom.sh
            EXTRACT_FIRMWARE "FW/${{ github.event.inputs.TARGET_DEVICE }}"
          fi

      - name: Start Rom Build
        run: |
          if [ -f "scripts/ZineRom.sh" ]; then
            sed -i '/CPU ABI MISMATCH!/{n;s/exit 1/# exit 1/}' scripts/ZineRom.sh
          fi
          touch zinrom_build.log
          
          # فحص مكان ملف sixteen.sh وتشغيله بأمان
          if [ -f "sixteen.sh" ]; then
            chmod +x sixteen.sh
            sudo bash sixteen.sh "${{ github.event.inputs.STOCK_DEVICE }}" "${{ github.event.inputs.TARGET_DEVICE }}" "" "${{ github.event.inputs.OUTPUT_FILESYSTEM }}" 2>&1 | tee zinrom_build.log
          elif [ -f "scripts/sixteen.sh" ]; then
            chmod +x scripts/sixteen.sh
            sudo bash scripts/sixteen.sh "${{ github.event.inputs.STOCK_DEVICE }}" "${{ github.event.inputs.TARGET_DEVICE }}" "" "${{ github.event.inputs.OUTPUT_FILESYSTEM }}" 2>&1 | tee zinrom_build.log
          else
            echo "❌ File sixteen.sh not found!"
            exit 1
          fi

      - name: Compress images & prepare upload
        run: |
          echo "BUILD_TIME=$(TZ='Africa/Cairo' date '+%Y-%m-%d %I:%M:%S %p')" >> $GITHUB_ENV
          OUT_DIR="$(pwd)/OUT"
          ZIP_NAME="${{ github.event.inputs.TARGET_DEVICE }}_Port_For_${{ github.event.inputs.STOCK_DEVICE }}.zip"
          ZIP_PATH="$OUT_DIR/$ZIP_NAME"

          # مسح أي ملف img مساحته 0KB لتفادي مشكلة system_ext
          find "$OUT_DIR" -type f -size 0 -name "*.img" -delete

          ls -la "$OUT_DIR"
          if [ "${{ github.event.inputs.COMPRESS_IMG_TO_XZ }}" = "True" ]; then
            for file in "$OUT_DIR"/*.img; do
              if [ -f "$file" ]; then
                sudo xz -9 -T0 "$file"
              fi
            done
            7z a -tzip "$ZIP_PATH" "$OUT_DIR"/*.img.xz -mx=5
          else
            7z a -tzip "$ZIP_PATH" "$OUT_DIR"/*.img -mx=5
          fi

      - name: Upload Build Engine Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZineROM-Build-Logs-${{ github.run_id }}
          path: zinrom_build.log
          retention-days: 7

